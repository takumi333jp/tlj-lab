<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TLJ Visual Chord Lab</title>
<style>
:root{--bg:#07111f;--panel:#0e1c2f;--text:#f5f7fb;--muted:#9eb0c7;--gold:#d8b35e;--blue:#66a9ff;--line:#29415f;--tone:#dce8f7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#07111f,#0a1626)}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 44px}.brand{font-size:12px;letter-spacing:.16em;color:var(--gold);font-weight:800}h1{margin:6px 0;font-size:30px}.lead{color:var(--muted);line-height:1.65;margin:0 0 18px}
.card{background:rgba(14,28,47,.96);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}.controls{display:grid;grid-template-columns:1fr 140px;gap:10px}input,button{border-radius:11px;padding:12px 14px;font-size:16px}input{width:100%;background:#091524;border:1px solid var(--line);color:var(--text)}button{border:0;background:var(--gold);color:#07111f;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tab{width:auto;background:#0a1727;color:#dce8f7;border:1px solid #34506e;padding:9px 12px;margin:0}.tab.active{background:var(--gold);color:#07111f}.summary{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.badge{background:#091524;border:1px solid var(--line);border-radius:999px;padding:8px 11px;color:#dfe8f4;font-size:14px}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:10px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}.root{background:var(--blue)}.tone{background:var(--tone)}.tension{background:var(--gold)}
.section-title{font-size:19px;font-weight:800;margin:0 0 10px}.sub{color:var(--muted);font-size:13px;margin:-3px 0 10px}#score{background:#fff;border-radius:12px;overflow:auto;min-height:245px;padding:4px}.visual{width:100%;height:auto;display:block;background:#fff;border-radius:12px}.note{color:var(--muted);font-size:13px;line-height:1.6;margin-top:9px}code{color:#f2d78f}.error{color:#ffb4b4;font-weight:700;margin-top:10px;min-height:20px}@media(max-width:650px){.controls{grid-template-columns:1fr}h1{font-size:26px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">THINK LIKE JAZZ</div><h1>TLJ Visual Chord Lab</h1>
<p class="lead">1つのコードを「五線譜・ピアノ鍵盤・ギター指板」で同時に確認する学習用テスト版です。</p>
<div class="card">
<div class="controls"><input id="chords" value="Cmaj7,Dm9,G13,Cmaj7"><button id="drawBtn">表示する</button></div>
<div class="tabs" id="tabs"></div><div class="summary" id="summary"></div>
<div class="legend"><span><span class="dot root"></span>Root</span><span><span class="dot tone"></span>Chord Tone</span><span><span class="dot tension"></span>Tension</span></div><div class="error" id="error"></div>
</div>
<div class="card"><div class="section-title">🎼 五線譜</div><div class="sub">実用的な音域へまとめた参考ボイシング</div><div id="score"></div></div>
<div class="card"><div class="section-title">🎹 ピアノ鍵盤</div><div class="sub">C3〜B5。構成音を鍵盤上で確認できます。</div><div id="keyboard"></div></div>
<div class="card"><div class="section-title">🎸 ギター指板</div><div class="sub">Standard Tuning E–A–D–G–B–E / 0〜12フレット。構成音の位置を全表示します。</div><div id="fretboard"></div></div>
<div class="card"><div class="section-title">Mizou用URL</div><div class="note">例：<code>?chords=Cmaj7,Dm9,G13,Cmaj7</code><br>Mizouからコード進行を渡し、タブを切り替えながら学習できます。</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/vexflow@5.0.0/build/cjs/vexflow.js"></script>
<script>
const noteMap={C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};
const pcSharp=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"],pcFlat=["C","Db","D","Eb","E","F","Gb","G","Ab","A","Bb","B"],pcVex=["c","c#","d","eb","e","f","f#","g","ab","a","bb","b"];
let progression=[],selectedIndex=0;const uniqSort=a=>[...new Set(a)].sort((x,y)=>x-y);
function parseChord(symbol){const display=symbol.trim(),s=display.replace(/♭/g,'b').replace(/♯/g,'#').replace(/Δ/g,'maj'),m=s.match(/^([A-G])([#b]?)(.*)$/);if(!m)return null;const root=noteMap[m[1]+m[2]];if(root===undefined)return null;let q=m[3].toLowerCase().replace(/\s+/g,'').replace(/^min/,'m').replace(/^minor/,'m').replace(/^major/,'maj');let chord=[0,4,7],tensions=[];const half=q.includes('m7b5')||q.includes('ø'),dim7=q.includes('dim7')||q.includes('°7'),dim=!dim7&&(q.includes('dim')||q.includes('°')),minor=q.startsWith('m')&&!q.startsWith('maj')&&!half;if(half)chord=[0,3,6,10];else if(dim7)chord=[0,3,6,9];else if(dim)chord=[0,3,6];else if(q.includes('sus2'))chord=[0,2,7];else if(q.includes('sus4')||q==='sus')chord=[0,5,7];else if(minor)chord=[0,3,7];if(!half&&!dim&&!dim7){if(q.includes('maj7')||q.includes('maj9')||q.includes('maj11')||q.includes('maj13'))chord.push(11);else if(q.includes('7')||q.includes('9')||q.includes('11')||q.includes('13'))chord.push(10)}if(q.includes('b5')){chord=chord.filter(x=>x!==7);chord.push(6)}if(q.includes('#5')||q.includes('aug')){chord=chord.filter(x=>x!==7);chord.push(8)}if(q==='6'||q.includes('6/9')||q==='m6'||q.includes('m6/9'))chord.push(9);if(q.includes('b9'))tensions.push(13);if(q.includes('#9'))tensions.push(15);const n9=(q.includes('add9')||q.includes('6/9')||q.includes('maj9')||q.includes('m9')||q==='9'||q.includes('11')||q.includes('13'))&&!q.includes('b9')&&!q.includes('#9');if(n9)tensions.push(14);if(q.includes('#11'))tensions.push(18);else if(q.includes('11')||q.includes('add11'))tensions.push(17);if(q.includes('b13'))tensions.push(20);else if(q.includes('13'))tensions.push(21);chord=uniqSort(chord);tensions=uniqSort(tensions);return{symbol:display,root,chord,tensions,all:uniqSort([...chord,...tensions]),preferFlats:s.includes('b')}}
const pitchClass=(r,i)=>(r+i)%12,noteName=(pc,f)=>(f?pcFlat:pcSharp)[pc];function intervalLabel(iv){const map={0:'R',3:'b3',4:'3',6:'b5',7:'5',8:'#5',9:'6',10:'b7',11:'7',13:'b9',14:'9',15:'#9',17:'11',18:'#11',20:'b13',21:'13'};return map[iv]||map[iv%12]||String(iv)}
function chordSummary(ch){return [...ch.chord,...ch.tensions].map(iv=>`${noteName(pitchClass(ch.root,iv),ch.preferFlats)} (${intervalLabel(iv)})`).join(' / ')}
function practicalVoicing(ch){const base=60+ch.root,low=55,high=76;let notes=ch.all.map(iv=>({midi:base+iv,iv})).map(o=>{let n=o.midi;while(n>high)n-=12;while(n<low)n+=12;return{midi:n,iv:o.iv}}).sort((a,b)=>a.midi-b.midi);const seen=new Set();return notes.filter(o=>!seen.has(o.midi)&&(seen.add(o.midi),true))}
function midiToVex(m){return pcVex[((m%12)+12)%12]+'/'+(Math.floor(m/12)-1)}
function drawScore(ch){const box=document.getElementById('score');box.innerHTML='';if(!window.Vex){box.textContent='楽譜ライブラリを読み込めませんでした。';return}const{Renderer,Stave,StaveNote,Voice,Formatter,Accidental,Annotation,Modifier}=Vex.Flow,width=900,renderer=new Renderer(box,Renderer.Backends.SVG);renderer.resize(width,235);const ctx=renderer.getContext(),stave=new Stave(35,50,width-70);stave.addClef('treble').addTimeSignature('4/4').setContext(ctx).draw();const keys=practicalVoicing(ch).map(o=>midiToVex(o.midi)),note=new StaveNote({clef:'treble',keys,duration:'w'});keys.forEach((k,i)=>{if(k.includes('#'))note.addModifier(new Accidental('#'),i);else if(k.includes('b/'))note.addModifier(new Accidental('b'),i)});note.addModifier(new Annotation(ch.symbol).setVerticalJustification(Modifier.Position.ABOVE),0);const voice=new Voice({num_beats:4,beat_value:4});voice.addTickables([note]);new Formatter().joinVoices([voice]).format([voice],width-210);voice.draw(ctx,stave)}
function drawKeyboard(ch){const box=document.getElementById('keyboard'),start=48,end=83,whitePC=new Set([0,2,4,5,7,9,11]),whites=[];for(let m=start;m<=end;m++)if(whitePC.has(m%12))whites.push(m);const W=1000,H=245,margin=18,whiteW=(W-2*margin)/whites.length,whiteH=185,y=24,chordPC=new Set(ch.chord.map(iv=>pitchClass(ch.root,iv))),tensionPC=new Set(ch.tensions.map(iv=>pitchClass(ch.root,iv)));const color=pc=>pc===ch.root?'#66a9ff':tensionPC.has(pc)?'#d8b35e':'#dce8f7';let svg=`<svg class="visual" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="#fff"/>`;whites.forEach((m,i)=>{const x=margin+i*whiteW;svg+=`<rect x="${x}" y="${y}" width="${whiteW}" height="${whiteH}" fill="#fff" stroke="#111827" stroke-width="1.5"/>`});const blackPC=new Set([1,3,6,8,10]);let wi=0;for(let m=start;m<=end;m++){const pc=m%12;if(whitePC.has(pc)){wi++;continue}if(blackPC.has(pc)){const x=margin+wi*whiteW-whiteW*.32;svg+=`<rect x="${x}" y="${y}" width="${whiteW*.64}" height="${whiteH*.62}" rx="2" fill="#111827"/>`}}for(let m=start;m<=end;m++){const pc=m%12;if(!(chordPC.has(pc)||tensionPC.has(pc)))continue;let cx,cy;if(whitePC.has(pc)){const idx=whites.indexOf(m);cx=margin+(idx+.5)*whiteW;cy=y+whiteH-33}else{let prev=0;for(let x=start;x<m;x++)if(whitePC.has(x%12))prev++;cx=margin+prev*whiteW;cy=y+whiteH*.62-25}svg+=`<circle cx="${cx}" cy="${cy}" r="15" fill="${color(pc)}" stroke="#07111f" stroke-width="2"/><text x="${cx}" y="${cy+5}" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#07111f">${noteName(pc,ch.preferFlats)}</text>`}box.innerHTML=svg+'</svg>'}
function drawFretboard(ch){const box=document.getElementById('fretboard'),W=1000,H=340,left=78,right=30,top=42,bottom=40,frets=12,strings=6,fretW=(W-left-right)/frets,stringGap=(H-top-bottom)/(strings-1),tuning=[64,59,55,50,45,40],chordPC=new Set(ch.chord.map(iv=>pitchClass(ch.root,iv))),tensionPC=new Set(ch.tensions.map(iv=>pitchClass(ch.root,iv))),color=pc=>pc===ch.root?'#66a9ff':tensionPC.has(pc)?'#d8b35e':'#dce8f7';let svg=`<svg class="visual" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"><rect width="${W}" height="${H}" fill="#fff"/>`;for(let f=0;f<=frets;f++){const x=f===0?left-34:left+(f-.5)*fretW;svg+=`<text x="${x}" y="25" text-anchor="middle" font-family="Arial" font-size="13" fill="#667085">${f}</text>`}svg+=`<line x1="${left}" y1="${top-10}" x2="${left}" y2="${H-bottom+10}" stroke="#111827" stroke-width="6"/>`;for(let f=1;f<=frets;f++){const x=left+f*fretW;svg+=`<line x1="${x}" y1="${top-10}" x2="${x}" y2="${H-bottom+10}" stroke="#667085" stroke-width="1.5"/>`}[3,5,7,9].forEach(f=>{const x=left+(f-.5)*fretW,y=(top+H-bottom)/2;svg+=`<circle cx="${x}" cy="${y}" r="5" fill="#cbd5e1"/>`});{const x=left+11.5*fretW,mid=(top+H-bottom)/2;svg+=`<circle cx="${x}" cy="${mid-28}" r="5" fill="#cbd5e1"/><circle cx="${x}" cy="${mid+28}" r="5" fill="#cbd5e1"/>`}tuning.forEach((openMidi,s)=>{const y=top+s*stringGap;svg+=`<line x1="${left-42}" y1="${y}" x2="${W-right}" y2="${y}" stroke="#344054" stroke-width="${1.4+s*.25}"/><text x="22" y="${y+5}" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#344054">${noteName(openMidi%12,false)}</text>`;for(let f=0;f<=frets;f++){const pc=(openMidi+f)%12;if(!(chordPC.has(pc)||tensionPC.has(pc)))continue;const x=f===0?left-24:left+(f-.5)*fretW;svg+=`<circle cx="${x}" cy="${y}" r="13.5" fill="${color(pc)}" stroke="#07111f" stroke-width="1.7"/><text x="${x}" y="${y+4.5}" text-anchor="middle" font-family="Arial" font-size="11.5" font-weight="800" fill="#07111f">${noteName(pc,ch.preferFlats)}</text>`}});box.innerHTML=svg+'</svg>'}
function renderTabs(){const box=document.getElementById('tabs');box.innerHTML='';progression.forEach((ch,i)=>{const b=document.createElement('button');b.className='tab'+(i===selectedIndex?' active':'');b.textContent=ch.symbol;b.onclick=()=>{selectedIndex=i;renderAll()};box.appendChild(b)})}
function renderAll(){const ch=progression[selectedIndex];renderTabs();document.getElementById('summary').innerHTML=`<span class="badge"><strong>${ch.symbol}</strong></span><span class="badge">${chordSummary(ch)}</span>`;drawScore(ch);drawKeyboard(ch);drawFretboard(ch)}
function parseProgression(){const raw=document.getElementById('chords').value.trim(),syms=raw.split(/[,|]/).map(s=>s.trim()).filter(Boolean),parsed=syms.map(parseChord),bad=parsed.findIndex(x=>!x);if(bad>=0){document.getElementById('error').textContent='解釈できないコードがあります: '+syms[bad];return}document.getElementById('error').textContent='';progression=parsed;selectedIndex=0;renderAll()}
const p=new URLSearchParams(location.search);if(p.get('chords'))document.getElementById('chords').value=p.get('chords');document.getElementById('drawBtn').addEventListener('click',parseProgression);parseProgression();
</script>
</body></html>
